<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3G Christmas 2026</title>
<meta name="description" content="3G Christmas 2026 — Christmas dinner, potluck and the family wishlist.">
<meta name="theme-color" content="#183F32">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#8C1D2C; --red-d:#701623; --green:#183F32; --green-2:#22533F; --gold:#C6A25A; --gold-l:#F1E5C8;
  --cream:#FAF4E8; --paper:#FFFCF6; --brown:#573C2E; --muted:#8a7565; --line:#EADFCB;
  --r:16px; --shadow:0 8px 24px rgba(87,60,46,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--brown);font:16px/1.55 "DM Sans",system-ui,-apple-system,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;color:var(--green);font-weight:700}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}
.wrapt{overflow-wrap:anywhere;word-break:break-word}

/* nav */
.nav{background:var(--green);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top)}
.nav .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{font-family:"Playfair Display",serif;font-weight:700;font-size:20px;color:#fff;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand span{color:var(--gold)}
.links{display:flex;gap:4px;margin-left:auto}
.links a{color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;font-weight:500;white-space:nowrap;opacity:.88;min-height:40px;display:flex;align-items:center}
.links a.on{background:var(--cream);color:var(--green);opacity:1;font-weight:700}
.gold-rule{height:4px;background:linear-gradient(90deg,var(--red) 0 33%,var(--gold) 33% 66%,var(--red) 66%)}

main{padding:28px 0 90px}
.page-title{text-align:center;margin:6px 0 26px}
.page-title h1{font-size:clamp(32px,7vw,48px);margin:8px 0 4px;line-height:1.1}
.page-title p{margin:0;font-style:italic;font-family:"Playfair Display",serif;font-size:18px;color:var(--red)}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold)}
.divider:before,.divider:after{content:"";height:1px;width:60px;background:var(--gold);opacity:.7}
h2.sec{font-size:26px;margin:36px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.sec .grow{flex:1}

.btn{font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.2;border:0;border-radius:999px;padding:11px 20px;min-height:44px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--red-d)}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-2)}
.btn.ghost{background:var(--paper);color:var(--brown);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff}
.btn.small{padding:7px 14px;min-height:38px;font-size:14px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}

/* landing */
.landing{text-align:center;padding-top:10px}
.landing h1{font-size:clamp(40px,10vw,72px);margin:6px 0 6px;line-height:1.02;letter-spacing:-.5px}
.landing h1 span{color:var(--red)}
.landing .sub{font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(18px,4.4vw,24px);color:var(--brown);margin:0}
.countdown{margin:30px auto 0;max-width:560px;background:var(--green);color:#fff;border-radius:24px;padding:30px 20px 26px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(24,63,50,.25);border:2px solid var(--gold)}
.countdown .big{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(64px,19vw,112px);line-height:1;color:var(--gold)}
.countdown .lbl{font-family:"Playfair Display",serif;font-size:clamp(22px,5.6vw,30px);margin-top:6px}
.countdown .small{opacity:.85;margin-top:8px;font-size:15px}
.countdown svg.deco{position:absolute;opacity:.22;pointer-events:none}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:34px auto 0;max-width:820px}
.choice{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 20px 24px;text-decoration:none;color:inherit;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden;transition:transform .15s, box-shadow .15s}
.choice:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(87,60,46,.12)}
.choice:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--red)}
.choice.w:before{background:var(--green)}
.choice h2{font-size:clamp(24px,5.5vw,30px);margin:6px 0 0}
.choice p{margin:0;font-family:"Playfair Display",serif;font-style:italic;color:var(--red);font-size:17px}
.choice .meta{font-size:14px;color:var(--muted);margin-top:6px}
.choice .go{margin-top:12px}

/* cards */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.info{padding:6px 20px}
.irow{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .k{font-weight:700;color:var(--green);display:flex;gap:8px;align-items:flex-start}
.irow .v{min-width:0}
.tba{color:var(--muted);font-style:italic}
.info-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:#fff8ec;border-radius:0 0 var(--r) var(--r)}
.edited{font-size:13px;color:var(--muted);margin-left:auto;align-self:center}

/* potluck */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cat{padding:16px}
.cat h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.cat h3 .n{font:500 13px "DM Sans";color:var(--muted);margin-left:auto}
.cat .none{color:var(--muted);font-style:italic;font-size:14px;padding:6px 0}
.dish{padding:12px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
.dish:first-of-type{border-top:0}
.dish .t{flex:1;min-width:0}
.dish .nm{font-weight:700;color:var(--brown)}
.pic{display:inline-flex;align-items:center;gap:6px;background:var(--gold-l);color:var(--brown);border-radius:999px;padding:2px 10px 2px 3px;font-size:13px;font-weight:700;margin-top:4px;max-width:100%}
.pic .av{width:22px;height:22px;font-size:10px}
.dish .sm{font-size:14px;color:var(--muted)}
.dish .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex:none}

/* wishlist */
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filterbar label{font-weight:700;color:var(--green)}
.filterbar select{flex:1;min-width:0;max-width:340px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;min-height:46px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.pcard.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.pcard .nm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--brown);min-width:0}
.pcard .nm span.x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.st{font-size:13px;border-radius:999px;padding:2px 10px;background:#fff;border:1px solid var(--line)}
.st.o{color:var(--green);border-color:#cfe0d6;background:#eef5f0}
.st.p{color:var(--red);border-color:#ecc9cd;background:#fbeff0}
.pnl{padding:14px 16px;margin-bottom:16px}
.pnl .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pnl .hd h3{margin:0;font-size:24px;flex:1;min-width:0}
.pnl .notes{white-space:pre-wrap;margin-top:8px;font-size:15px}
.pnl .ph0{color:var(--muted);font-size:14px;margin-top:6px}
.pnl .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gname{font-size:22px;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gift{display:flex;flex-direction:column;overflow:hidden}
.gift .ph{aspect-ratio:4/3;background:var(--gold-l);display:flex;align-items:center;justify-content:center;position:relative;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.gift .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gift .ph .ico{width:56px;height:56px;opacity:.55}
.status{position:absolute;top:10px;left:10px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.open{background:#fff;color:var(--green);border:1px solid #cfe0d6}
.status.done{background:var(--red);color:#fff}
.gift .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.gift .title{font-weight:700;font-size:17px;line-height:1.3;color:var(--brown)}
.gift .price{color:var(--red);font-weight:700}
.gift .note{color:var(--muted);font-size:14px}
.gift .lnk{font-size:14px;font-weight:700;text-decoration:none;margin-top:2px}
.gift .meta{font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.gift .acts{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.gift .acts .btn{flex:1 1 auto;white-space:normal;text-align:center}
.gift .acts .wide{flex-basis:100%}
.gift.done .ph img{filter:saturate(.55)}

.empty{text-align:center;padding:36px 18px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:"Playfair Display",serif;font-size:21px;color:var(--green);margin-bottom:4px}
.empty .btn{margin-top:14px}
.notice{border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 18px;background:#fbeff0;border:1px solid #ecc9cd}
.notice.info{background:var(--gold-l);border-color:#e6d3a6}

/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(40,28,22,.55);display:none;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px 16px;overflow-y:auto;z-index:50;overscroll-behavior:contain}
.overlay.on{display:flex}
.dlg{background:var(--paper);border-radius:20px;width:100%;max-width:540px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto 0}
.dlg.sm{max-width:420px}
.dlg h3{font-size:24px;margin:0 0 14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;min-width:0}
.f label{font-size:14px;font-weight:700;color:var(--green)}
.f label i{font-weight:400;color:var(--muted);font-style:normal}
.f input,.f textarea,.f select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;width:100%;font-size:16px;min-height:46px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--brown) 50%),linear-gradient(135deg,var(--brown) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.f input[type=date],.f input[type=time]{min-height:46px}
.f textarea{min-height:90px;resize:vertical}
.f .hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linkrow{display:flex;gap:6px}
.linkrow input{flex:1;min-width:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;background:#fff;outline:none}
.drop:focus,.drop.over{border-color:var(--green);background:#eef5f0}
.drop img{max-width:100%;max-height:180px;border-radius:8px;display:block;margin:0 auto 8px}
.drop .t{font-size:14px;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.foot .left{margin-right:auto}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;width:max-content;max-width:calc(100vw - 32px);text-align:center;border:1px solid var(--gold)}
.toast.on{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.gate{max-width:380px;margin:50px auto;text-align:center}
.gate input{width:100%;border:1px solid var(--line);border-radius:999px;padding:12px 16px;margin:14px 0;text-align:center;background:#fff;font-size:16px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 0 30px}
.ferr{background:#fbeff0;border:1px solid #ecc9cd;color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.ferr.info{background:var(--gold-l);border-color:#e6d3a6;color:var(--brown)}
/* potluck summary + table */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip b{color:var(--green);margin-left:4px}
.chip.zero{opacity:.65}
.ptable{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ptable th{background:var(--green);color:#fff;text-align:left;font-weight:700;font-size:14px;padding:12px 14px;white-space:nowrap}
.ptable td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.ptable tr:nth-child(even) td{background:#fff8ec}
.ptable td.nm{font-weight:700}
.ptable td.ac{white-space:nowrap;text-align:right;width:1%}
.catpill{display:inline-block;background:var(--gold-l);border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.pcards{display:none;flex-direction:column;gap:10px}
.pc{padding:14px}
.pc .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.pc .nm{font-weight:700;font-size:17px;min-width:0}
.pc .row{font-size:14px;margin-top:6px;color:var(--brown)}
.pc .row span{color:var(--muted)}
.pc .acts{display:flex;gap:8px;margin-top:10px}
.pc .acts .btn{flex:1}
@media (max-width:900px){.ptable{display:none}.pcards{display:flex}}
.sub-sec{margin:-8px 0 14px;font-family:"Playfair Display",serif;font-style:italic;color:var(--red);font-size:18px}
.bnav{display:none}
.calink{font-size:14px;font-weight:700;text-decoration:none;align-self:center}

@media (max-width:700px){
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .nav{position:relative}
  .nav .wrap{min-height:52px;justify-content:center}
  .brand{font-size:18px}
  .links{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--green);border-top:3px solid var(--gold);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;text-decoration:none;font-size:12px;font-weight:500;padding:6px 0;border-radius:12px;opacity:.82;min-height:52px;justify-content:center}
  .bnav a svg{width:22px;height:22px}
  .bnav a.on{background:var(--cream);color:var(--green);opacity:1;font-weight:700}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .overlay{align-items:flex-end;padding:12px 0 0}
  .dlg{border-radius:22px 22px 0 0;max-width:none;margin:0;max-height:94vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .dlg .foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--paper);padding:10px 0 4px;margin-bottom:0}
  .dlg .foot .btn{flex:1}
  .ptable{display:none}
  .pcards{display:flex}
  .choices{grid-template-columns:1fr}
  .cats{grid-template-columns:1fr}
  .irow{grid-template-columns:1fr;gap:2px}
  .row2{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .gift .body{padding:10px}
  .gift .title{font-size:15px}
  .gift .acts .btn{flex-basis:100%}
  .filterbar label{display:none}
  .filterbar select{flex:1 1 100%;max-width:none}
  .filterbar .btn{flex:1}
  .status{font-size:11px;padding:3px 8px;top:6px;left:6px}
  .people{grid-template-columns:1fr 1fr}
  h2.sec{font-size:23px}
  .info-actions .btn{flex:1}
  .edited{margin-left:0;width:100%;text-align:center}
}
@media (max-width:380px){
  .grid,.people{grid-template-columns:1fr}
  .wrap{padding:0 14px}
  .links a{font-size:14px}
  .dish{flex-wrap:wrap}
  .dish .acts{width:100%;justify-content:flex-start}
}
</style>
</head>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => n ? "Rp " + Math.round(n).toLocaleString("id-ID") : "";
const lc = s => String(s || "").trim().replace(/\s+/g," ").toLowerCase();
const safeUrl = u => { try { const x = new URL(String(u||"").trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const ls = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch{} } };
const COLORS = ["#8C1D2C","#183F32","#A87F35","#573C2E","#2F5D50","#A3283A","#6B4A3A","#3C6E57"];
const color = s => COLORS[[...lc(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const avatar = (name, size=32) => `<span class="av" style="background:${color(name)};width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px">${esc(initials(name))}</span>`;
const plural = (n, w, pl) => `${n} ${n===1 ? w : (pl || w+"s")}`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
const myName = () => ls.get("wl_name") || "";   // convenience prefill only — never the source of truth
const rememberName = n => n && ls.set("wl_name", n);
function toast(t, ms=2800){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),ms); }
const svg = (id, w, h, extra="") => `<svg width="${w}" height="${h}" ${extra} aria-hidden="true"><use href="#${id}"/></svg>`;

/* ---------- state (always loaded from the server) ---------- */
let event = {}, people = [], items = [], potluck = [], version = -1, loaded = false, warn = null, pendingRender = false, notesEditing = null;
const personOf = id => people.find(p=>p.id===id);

/* ---------- routing: /  /dinner  /wishlist?person=<id> ---------- */
let route = { page:"home", person:"all" };
function readRoute(){
  const h = location.hash.slice(1);       // links from earlier versions
  if (h === "dinner" || h === "potluck") return navigate("/dinner", true);
  if (h === "wishlist") return navigate("/wishlist", true);
  if (h.startsWith("w-")) return navigate("/wishlist?person=" + encodeURIComponent(h.slice(2)), true);
  const p = location.pathname.replace(/\/+$/,"") || "/";
  route.page = p === "/dinner" ? "dinner" : p === "/wishlist" ? "wishlist" : "home";
  route.person = new URLSearchParams(location.search).get("person") || "all";
}
function navigate(url, replace){
  const before = route.page;
  history[replace ? "replaceState" : "pushState"](null, "", url);
  readRoute(); render();
  if (!replace && before !== route.page) window.scrollTo({top:0});
}
window.addEventListener("popstate", ()=>{ readRoute(); render(); });
document.addEventListener("click", e=>{
  const a = e.target.closest("a[data-link]"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); navigate(a.getAttribute("href"));
});
readRoute();

/* ---------- API ---------- */
async function api(path, opts = {}){
  const headers = { "Content-Type":"application/json" };
  const code = ls.get("wl_code"); if (code) headers["x-access-code"] = code;
  let r;
  try { r = await fetch(path, { ...opts, headers, cache:"no-store", body: opts.body ? JSON.stringify(opts.body) : undefined }); }
  catch { throw { error: "No connection — please check your internet and try again." }; }
  const data = await r.json().catch(()=>({}));
  if (r.status === 401 && data.error === "access_code") { showGate(); throw { gate:true }; }
  if (!r.ok) throw { status:r.status, ...data };
  return data;
}
async function refresh(force){
  try{
    const d = await api(`/api/data?since=${force ? -1 : version}&t=${Date.now()}`);
    warn = d.warn || null;
    if (d.changed){
      event = d.event || {}; people = (d.people||[]).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      items = d.items || []; potluck = d.potluck || []; version = d.version; loaded = true;
      if (!busy()) render(); else pendingRender = true;
    }
    netDown(false);
  }catch(e){
    if (e.gate) return;
    netDown(true);
    if (!loaded) $("#app").innerHTML = `<main class="wrap"><div class="empty"><b>Can't load right now</b>${e.status ? "The server returned an error ("+e.status+"). If this just got deployed, check the database connection in Vercel." : "Please check your connection — retrying…"}</div></main>`;
  }
}
let pollT, isDown = false;
const busy = () => !!document.querySelector(".overlay.on") || !!notesEditing;
function startPolling(){ clearInterval(pollT); pollT = setInterval(()=>{ if (!document.hidden) refresh(); }, 10000); }
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refresh(); });
window.addEventListener("focus", ()=>refresh());
function netDown(on){ if (on===isDown) return; isDown=on; if (on && loaded) toast("Can't reach the server — retrying…"); }
// errors from a save: show the message; on conflicts reload the latest data so the user can review
async function handleErr(err, conflictMsg){
  if (err?.gate) return;
  if (err?.status === 409 || err?.status === 404){ await refresh(true); toast(err.status===404 ? (err.error || "That was just deleted by someone else.") : (conflictMsg || "Someone else just changed this — the latest version is now shown. Please review."), 4500); return; }
  toast(err?.error || "Couldn't save — please try again.");
}

/* saving: spinner, no double submit, form stays open on failure, success only after the server confirms */
function upsert(list, obj){ if (!obj) return; const i = list.findIndex(x=>x.id===obj.id); if (i >= 0) list[i] = obj; else list.push(obj); }
function showErr(box, html, info){ const el = $(box); if (!el) return; el.innerHTML = html || ""; el.hidden = !html; el.classList.toggle("info", !!info); if (html) el.scrollIntoView({block:"nearest"}); }
async function saving(btn, errBox, work, onConflict){
  if (btn.disabled) return;
  const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Saving…`; if (errBox) showErr(errBox, "");
  try { await work(); }
  catch(err){
    if (err?.gate) return;
    if (err?.status === 404){ closeAll(); await refresh(true); toast(err.error || "That was just deleted by someone else.", 4000); return; }
    if (err?.status === 409 && onConflict){ await refresh(true); const msg = onConflict(err); if (errBox) showErr(errBox, msg, true); else toast(msg, 4500); return; }
    const msg = "⚠️ " + esc(err?.error || "Couldn't save — please check your connection and try again.");
    if (errBox) showErr(errBox, msg); else toast(msg, 4000);
  } finally { btn.disabled = false; btn.innerHTML = label; }
}
const afterSave = msg => { closeAll(); render(); toast(msg); refresh(true); };
const CONFLICT = "Someone else changed this while you were editing — the list now shows their version. Your changes are still here: press <b>Save</b> again to keep yours, or <b>Cancel</b>.";

function showGate(){
  clearInterval(pollT);
  $("#app").innerHTML = `<main class="wrap"><form class="gate" id="gate"><h2>Family only</h2><p style="color:var(--muted)">Enter the access code to open the site.</p>
    <input id="gateIn" placeholder="Access code" autofocus><button class="btn green" style="width:100%">Open</button></form></main>`;
  $("#gate").addEventListener("submit", e=>{ e.preventDefault(); ls.set("wl_code", $("#gateIn").value.trim()); refresh(true).then(()=>loaded && startPolling()); });
}

/* ---------- render ---------- */
function render(){
  pendingRender = false;
  document.querySelectorAll("#links a, #bnav a").forEach(a=>a.classList.toggle("on", a.dataset.p===route.page));
  document.title = route.page==="dinner" ? "Christmas Dinner · 3G Christmas 2026" : route.page==="wishlist" ? "Christmas Wishlist · 3G Christmas 2026" : "3G Christmas 2026";
  if (route.page === "home") return renderHome();   // landing works even before data arrives
  if (!loaded) return;
  const names = [...new Set([...people.map(p=>p.name), ...potluck.map(d=>d.who), ...items.map(i=>i.boughtBy)].filter(Boolean))];
  $("#namesList").innerHTML = names.map(n=>`<option value="${esc(n)}">`).join("");
  route.page === "dinner" ? renderDinner() : renderWishlist();
}
const warnHtml = () => warn === "no_database" ? `<div class="notice">⚠️ <b>Database not connected.</b> Changes won't be saved. In Vercel → Storage, connect the Upstash Redis database to this project, then redeploy.</div>`
  : warn === "preview" ? `<div class="notice info">🧪 This is a <b>preview</b> deployment with its own test data — the real site's data is not affected.</div>` : "";

/* ===== HOME ===== */
const XMAS = Date.UTC(2026, 11, 24, 17, 0, 0);   // 25 Dec 2026 00:00 in Asia/Jakarta (UTC+7)
const DAY = 864e5;
function countdownInner(){
  const now = Date.now(), diff = XMAS - now;
  if (diff <= 0 && diff > -DAY) return `<div class="big">🎄</div><div class="lbl">Merry Christmas!</div><div class="small">It's finally here — enjoy every moment together.</div>`;
  if (diff <= -DAY) return `<div class="big">✨</div><div class="lbl">Christmas 2026 has come and gone</div><div class="small">Thank you for celebrating together. See you next Christmas!</div>`;
  const d = Math.floor(diff/DAY), h = Math.floor(diff%DAY/36e5), m = Math.floor(diff%36e5/6e4);
  if (d === 0) return `<div class="big">${h}h ${m}m</div><div class="lbl">Until Christmas — it's Christmas Eve!</div>`;
  return `<div class="big">${d}</div><div class="lbl">${d===1?"Day":"Days"} Until Christmas!</div><div class="small">and ${plural(h,"hour")}, ${plural(m,"minute")} · 25 December 2026</div>`;
}
setInterval(()=>{ const c = $("#cdInner"); if (c) c.innerHTML = countdownInner(); }, 20000);
function dinnerSummary(){
  if (!loaded) return "";
  if (!event.date) return "📅 Date to be announced";
  return "📅 " + esc(new Date(event.date+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})) + (event.start ? " · " + esc(event.start) : "");
}
function renderHome(){
  const open = items.filter(i=>i.status!=="done").length;
  $("#app").innerHTML = `
  <main class="wrap landing">
    ${warnHtml()}
    ${svg("holly",120,70)}
    <h1>3G Christmas <span>2026</span></h1>
    <p class="sub">It's the most wonderful time of the year!</p>
    <section class="countdown" aria-live="polite">
      <svg class="deco" width="70" height="94" style="left:-14px;top:-10px;color:var(--red)"><use href="#ornament"/></svg>
      <svg class="deco" width="56" height="75" style="right:-6px;bottom:-14px;color:var(--gold)"><use href="#ornament"/></svg>
      <svg class="deco" width="22" height="22" style="right:40px;top:18px;color:var(--gold);opacity:.5"><use href="#star"/></svg>
      <div id="cdInner">${countdownInner()}</div>
    </section>
    <div class="choices">
      <a class="choice" href="/dinner" data-link>
        ${svg("dinner",72,72)}
        <h2>Christmas Dinner</h2>
        <p>Let's celebrate together!</p>
        <div class="meta"><b style="color:var(--brown)">${dinnerSummary()}</b>${loaded ? `<br>🍲 ${plural(potluck.length,"potluck item")}` : ""}</div>
        <span class="btn go">View dinner & potluck</span>
      </a>
      <a class="choice w" href="/wishlist" data-link>
        ${svg("gift",72,72)}
        <h2>Christmas Wishlist</h2>
        <p>Make a wish, spread the joy!</p>
        <div class="meta">${loaded ? `<b style="color:var(--brown)">👥 ${plural(people.length,"participant")}</b><br>🎁 ${plural(items.length,"gift")} · ${open} open` : ""}</div>
        <span class="btn green go">Open the wishlist</span>
      </a>
    </div>
    <div style="margin-top:34px">${svg("pine",200,40)}</div>
  </main>`;
}

/* ===== DINNER + POTLUCK ===== */
const TBA = `<span class="tba">To Be Announced</span>`;
function fmtDate(){ if (!event.date) return ""; return new Date(event.date+"T12:00").toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"}); }
function gcalLink(){
  if (!event.date) return "";
  const pad = n => String(n).padStart(2,"0"), ymd = event.date.replace(/-/g,"");
  let dates;
  if (event.start){
    const [h,m] = event.start.split(":").map(Number);
    let eh = h + 3, em = m;
    if (event.end){ [eh, em] = event.end.split(":").map(Number); if (eh*60+em <= h*60+m) eh += 24; }
    const endDay = new Date(event.date+"T12:00"); endDay.setDate(endDay.getDate() + Math.floor(eh/24));
    const eymd = `${endDay.getFullYear()}${pad(endDay.getMonth()+1)}${pad(endDay.getDate())}`;
    dates = `${ymd}T${pad(h)}${pad(m)}00/${eymd}T${pad(eh%24)}${pad(em)}00`;
  } else {
    const n = new Date(event.date+"T12:00"); n.setDate(n.getDate()+1);
    dates = `${ymd}/${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}`;
  }
  const p = new URLSearchParams({ action:"TEMPLATE", text: event.title || "3G Christmas Dinner", dates, ctz:"Asia/Jakarta",
    location: [event.place, event.address].filter(Boolean).join(", "), details: [event.dress ? "Dress code: "+event.dress : "", event.notes || "", location.origin].filter(Boolean).join("\n\n") });
  return "https://calendar.google.com/calendar/render?" + p;
}
const CATS = [["main","Main Course","🍗"],["side","Side Dish","🥗"],["dessert","Dessert","🍰"],["drinks","Drinks","🥤"],["snacks","Snacks","🍪"],["other","Others","🧺"]];
const catOf = d => CATS.some(c=>c[0]===d.cat) ? d.cat : "other";   // older/unknown categories show under Others
const catLabel = v => (CATS.find(c=>c[0]===v) || CATS[5]);
$("#dCat").innerHTML = `<option value="" disabled>Choose a category</option>` + CATS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
const qtyText = d => d.qty || (d.serves ? `${d.serves} servings` : "");

function renderDinner(){
  const map = safeUrl(event.mapUrl);
  const cal = gcalLink();
  const order = Object.fromEntries(CATS.map((c,i)=>[c[0],i]));

/* ===== WISHLIST ===== */
function pstats(p){ const list = items.filter(i=>i.personId===p.id), bought = list.filter(i=>i.status==="done").length; return { list, bought, open: list.length - bought }; }
function photoSrc(i){
  if (i.photoV) return `/api/photo?id=${encodeURIComponent(i.id)}&v=${i.photoV}` + (ls.get("wl_code") ? `&code=${encodeURIComponent(ls.get("wl_code"))}` : "");
  return safeUrl(i.photoUrl);
}
const giftIcon = `<svg class="ico" aria-hidden="true"><use href="#gift"/></svg>`;
const imgTag = i => { const s = photoSrc(i); return s ? `<img src="${esc(s)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=giftIcon">` : giftIcon; };
const setPerson = (id, scroll) => { navigate(id && id !== "all" ? "/wishlist?person=" + encodeURIComponent(id) : "/wishlist"); if (scroll) $("#wl")?.scrollIntoView({behavior:"smooth", block:"start"}); };
const buyerName = i => personOf(i.boughtById)?.name || i.boughtBy || "someone";

function renderWishlist(){
  let selId = route.person;
  if (selId !== "all" && !personOf(selId)) selId = "all";
  const sel = selId === "all" ? null : personOf(selId);
  const list = items.filter(i => personOf(i.personId) && (!sel || i.personId === sel.id))
    .sort((a,b)=>(a.status==="done")-(b.status==="done") || (b.prio||2)-(a.prio||2) || (b.createdAt||0)-(a.createdAt||0));

  const dash = people.map(p=>{ const s = pstats(p); return `
    <button class="pcard ${sel?.id===p.id?"on":""}" data-person="${p.id}" aria-pressed="${sel?.id===p.id}">
      <div class="nm">${avatar(p.name)}<span class="x">${esc(p.name)}</span></div>
      <div class="stats"><span class="st">${plural(s.list.length,"gift")}</span><span class="st o">${s.open} Open</span><span class="st p">${s.bought} Purchased</span></div>
    </button>`; }).join("");

  let body;
  if (!people.length) body = `<div class="empty"><b>No one on the wishlist yet</b>Add the first person — yourself or anyone you're making a list for.<br><button class="btn" data-act="addPerson">+ Add person</button></div>`;
  else if (!list.length) body = `<div class="empty"><b>${sel ? esc(sel.name)+" has no gifts yet" : "No gifts yet"}</b>Anyone can add ideas.<br><button class="btn" data-act="addGift">+ Add gift${sel ? " for "+esc(sel.name) : ""}</button></div>`;
  else if (sel) body = `<div class="grid">${list.map(card).join("")}</div>`;
  else body = people.filter(p=>list.some(i=>i.personId===p.id)).map(p=>`
      <h3 class="gname">${avatar(p.name,34)}<span class="wrapt">${esc(p.name)}</span></h3>
      <div class="grid">${list.filter(i=>i.personId===p.id).map(card).join("")}</div>`).join("");

  $("#app").innerHTML = `
  <main class="wrap">
    ${warnHtml()}
    <div class="page-title">${svg("gift",64,64)}<h1>Christmas Wishlist</h1><p>Make a wish, spread the joy!</p></div>
    <h2 class="sec" style="margin-top:0">👥 People <span class="grow"></span><button class="btn" data-act="addPerson">+ Add Person</button></h2>
    ${people.length ? `<div class="people">${dash}</div>` : ""}
    ${people.length ? `
    <h2 class="sec" id="wl">🎁 Wishlist</h2>
    <div class="filterbar">
      <label for="pf">Show</label>
      <select id="pf"><option value="all">All People</option>${people.map(p=>`<option value="${p.id}" ${sel?.id===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
      <button class="btn green" data-act="addGift">+ Add Gift${sel ? " for "+esc(sel.name) : ""}</button>
    </div>` : ""}
    ${sel ? `<section class="panel pnl" id="pnl">
      <div class="hd">${avatar(sel.name,40)}<h3 class="wrapt">${esc(sel.name)}'s wishlist</h3></div>
      <div id="notesBox">${sel.notes ? `<div class="notes wrapt">${esc(sel.notes)}</div>` : `<div class="ph0">Add notes like sizes, favourite colours or things they already have.</div>`}</div>
      <div class="acts">
        <button class="btn ghost small" data-act="editNotes">${sel.notes ? "Edit notes" : "Add notes"}</button>
        <button class="btn ghost small" data-act="shareLink">🔗 Copy link</button>
        <button class="btn ghost small" data-act="renamePerson">Rename</button>
        <button class="btn ghost small danger" data-act="deletePerson">Delete person</button>
      </div></section>` : ""}
    <div>${body}</div>
  </main>`;
  $("#pf")?.addEventListener("change", e=>setPerson(e.target.value));
}

function card(i){
  const done = i.status === "done", url = safeUrl(i.link);
  let host = ""; try { host = url ? new URL(url).hostname.replace(/^www\./,"") : ""; } catch {}
  const when = i.updatedAt ? new Date(i.updatedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
  const acts = done
    ? `<button class="btn ghost small" data-act="changeBuyer" data-id="${i.id}">Change Purchaser</button><button class="btn ghost small" data-act="unbuy" data-id="${i.id}">Undo Purchase</button>`
    : `<button class="btn green small wide" data-act="buy" data-id="${i.id}">Mark as Purchased</button>`;
  return `<article class="panel gift ${done?"done":""}" data-row="${i.id}">
    <div class="ph">${imgTag(i)}<span class="status ${done?"done":"open"}">${done ? "Purchased by " + esc(buyerName(i)) : "Open"}</span></div>
    <div class="body">
      <div class="title wrapt">${esc(i.item)}</div>
      ${i.price ? `<div class="price">${rp(i.price)}</div>` : ""}
      ${i.note ? `<div class="note wrapt">${esc(i.note)}</div>` : ""}
      ${url ? `<a class="lnk wrapt" href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 Open product link${host ? " · "+esc(host) : ""}</a>` : ""}
      <div class="meta">${i.updatedBy ? `Updated by ${esc(i.updatedBy)} · ` : ""}${when}</div>
      <div class="acts">${acts}<button class="btn ghost small" data-act="edit" data-id="${i.id}">Edit</button><button class="btn ghost small danger" data-act="delGift" data-id="${i.id}">Delete</button></div>
    </div></article>`;
}

/* ---------- click actions ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-person],[data-act],[data-close]"); if(!t) return;
  if (t.dataset.close !== undefined) return closeAll();
  if (t.dataset.person) return setPerson(route.person === t.dataset.person ? "all" : t.dataset.person, true);
  const it = items.find(x=>x.id===t.dataset.id), sel = personOf(route.person), dish = potluck.find(d=>d.id===t.dataset.id);
  ({
    editEvent: openEvent,
    addDish: ()=>openDish(null, t.dataset.cat), editDish: ()=>dish && openDish(dish), delDish: ()=>dish && delDish(dish),
    addPerson, addGift: ()=>openGift(null, sel?.id),
    renamePerson: ()=>sel && renamePerson(sel), deletePerson: ()=>sel && deletePerson(sel),
    shareLink: ()=>sel && shareLink(sel), editNotes: ()=>sel && editNotes(sel),
    edit: ()=>it && openGift(it), delGift: ()=>it && delGift(it),
    buy: ()=>it && buy(it), changeBuyer: ()=>it && changeBuyer(it), unbuy: ()=>it && unbuy(it),
  })[t.dataset.act]?.();
});

/* ---------- dialogs ---------- */
function openDlg(sel){ $(sel).classList.add("on"); document.body.style.overflow = "hidden"; setTimeout(()=>{ const f = $(sel).querySelector("input:not([hidden]):not([type=file]),select,textarea"); if (f && matchMedia("(min-width:700px)").matches) f.focus(); }, 40); }
function closeAll(){
  document.querySelectorAll(".overlay.on").forEach(o=>o.classList.remove("on"));
  document.body.style.overflow = ""; askCb = null;
  if (pendingRender) render();
}
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("mousedown", e=>{ if(e.target===o) closeAll(); }));
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeAll(); });

let askCb = null;
function ask({title, text="", label="", value="", ok="OK", field=true, danger=false}, cb){
  showErr("#aErr", ""); $("#aTitle").textContent = title; $("#aText").innerHTML = text; $("#aText").hidden = !text;
  $("#aFieldWrap").hidden = !field; $("#aLabel").textContent = label; $("#aField").value = value;
  $("#aOk").textContent = ok; $("#aOk").className = "btn " + (danger ? "" : "green");
  askCb = cb; openDlg("#ovAsk");
  setTimeout(()=>{ if (field) { $("#aField").focus(); $("#aField").select(); } }, 60);
}
$("#askForm").addEventListener("submit", e=>{
  e.preventDefault(); if (!askCb) return;
  const v = $("#aField").value.trim();
  if (!$("#aFieldWrap").hidden && !v) { showErr("#aErr", "⚠️ Please fill this in."); return $("#aField").focus(); }
  const cb = askCb;
  saving($("#aOk"), "#aErr", ()=>cb(v), ()=>"Someone else changed this at the same time — the latest version is now shown. Please check and try again.");
});

/* people */
async function createPerson(name, id){
  try { return (await api("/api/people", { method:"POST", body:{ name, id } })).person; }
  catch(err){ if (err.status === 409 && err.person) { upsert(people, err.person); throw { error: `"${err.person.name}" is already on the list. Choose a different name.` }; } throw err; }
}
function addPerson(){
  closeAll(); const id = uid();
  ask({ title:"Add a person", text:"Whose wishlist is this? You can add family members too.", label:"Name", ok:"Add Person" }, async name=>{
    const p = await createPerson(name, id);
    upsert(people, p); closeAll(); setPerson(p.id, true); toast(`${p.name} added ✓ — you can add gifts now`); refresh(true);
  });
}
function renamePerson(p){
  ask({ title:"Rename", label:"Name", value:p.name, ok:"Save" }, async name=>{
    const r = await api(`/api/people?id=${p.id}`, { method:"PATCH", body:{ name, base: p.updatedAt ?? null } }); upsert(people, r.person); afterSave("Renamed ✓");
  });
}
function deletePerson(p){
  const n = items.filter(i=>i.personId===p.id).length;
  ask({ title:`Delete ${p.name}?`, text:`This removes ${esc(p.name)}${n?` and all ${plural(n,"gift")} on their list`:""} for everyone. This can't be undone.`, field:false, ok:"Delete", danger:true }, async ()=>{
    await api(`/api/people?id=${p.id}`, { method:"DELETE" });
    people = people.filter(x=>x.id!==p.id); items = items.filter(i=>i.personId!==p.id);
    closeAll(); setPerson("all"); toast("Deleted"); refresh(true);
  });
}
function shareLink(p){
  const url = location.origin + "/wishlist?person=" + encodeURIComponent(p.id);
  const ok = ()=>toast(`Link to ${p.name}'s wishlist copied`);
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(ok, ()=>ask({ title:"Copy this link", text:esc(url), field:false, ok:"Done" }, async()=>{}));
  else ask({ title:"Copy this link", text:esc(url), field:false, ok:"Done" }, async()=>{});
}
function editNotes(p){
  notesEditing = p.id;
  $("#notesBox").innerHTML = `<div class="f" style="margin:10px 0 0"><textarea id="notesIn" maxlength="1000" placeholder="e.g. Shirt size M, shoe 39 · Loves sage green · Already has AirPods">${esc(p.notes||"")}</textarea></div>
    <div class="foot"><button class="btn ghost small" id="notesCancel">Cancel</button><button class="btn green small" id="notesSave">Save notes</button></div>`;
  $("#notesIn").focus();
  $("#notesCancel").onclick = ()=>{ notesEditing = null; render(); };
  $("#notesSave").onclick = async ()=>{
    const b = $("#notesSave"); if (b.disabled) return; b.disabled = true;
    try{ const r = await api(`/api/people?id=${p.id}`, { method:"PATCH", body:{ notes: $("#notesIn").value, base: p.updatedAt ?? null } }); upsert(people, r.person); notesEditing = null; render(); toast("Notes saved ✓"); refresh(true); }
    catch(err){ b.disabled = false; await handleErr(err); }
  };
}

/* purchased status — purchaser is chosen from registered people (never the recipient) */
let buyItem = null, buyMode = "buy";
function openBuy(it, mode){
  buyItem = it; buyMode = mode; showErr("#bErr", "");
  const recipient = personOf(it.personId);
  const options = people.filter(p=>p.id !== it.personId).sort((a,b)=>a.name.localeCompare(b.name));
  $("#bTitle").textContent = mode === "buy" ? "Mark as Purchased" : "Change Purchaser";
  $("#bText").innerHTML = `<b>${esc(it.item)}</b> for <b>${esc(recipient?.name || "")}</b>` + (mode === "change" ? `<br>Currently purchased by <b>${esc(buyerName(it))}</b>.` : "");
  $("#bWho").innerHTML = `<option value="" disabled>Choose who purchased it</option>` + options.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  const current = mode === "change" ? (it.boughtById || people.find(p=>lc(p.name)===lc(it.boughtBy))?.id) : people.find(p=>lc(p.name)===lc(myName()))?.id;
  $("#bWho").value = options.some(p=>p.id===current) ? current : "";
  $("#bFieldWrap").hidden = !options.length; $("#bOk").hidden = !options.length;
  if (!options.length) showErr("#bErr", `Only ${esc(recipient?.name || "this person")} is registered. Add the purchaser as a person first.<br><button type="button" class="btn small" style="margin-top:8px" data-act="addPerson">+ Add Person</button>`, true);
  $("#bOk").textContent = mode === "buy" ? "Mark as Purchased" : "Save";
  openDlg("#ovBuy");
}
const buy = it => openBuy(it, "buy");
const changeBuyer = it => openBuy(it, "change");
$("#buyForm").addEventListener("submit", e=>{
  e.preventDefault(); const it = buyItem; if (!it) return;
  const byId = $("#bWho").value;
  if (!byId){ showErr("#bErr", "⚠️ Please choose who purchased it."); return $("#bWho").focus(); }
  const by = personOf(byId)?.name || "";
  saving($("#bOk"), "#bErr", async ()=>{
    if (buyMode === "buy"){
      try { await api(`/api/items?id=${it.id}&action=buy`, { method:"POST", body:{ boughtById: byId } }); }
      catch(err){
        if (err.status === 409 && err.error === "taken"){ closeAll(); await refresh(true); toast(`Already purchased by ${err.boughtBy || "someone else"} — please review the latest status.`, 5000); return; }
        throw err;
      }
      Object.assign(it, { status:"done", boughtBy: by, boughtById: byId, updatedBy: by });
    } else {
      const r = await api(`/api/items?id=${it.id}`, { method:"PATCH", body:{ boughtById: byId, updatedBy: by, base: it.updatedAt } });
      upsert(items, r.item);
    }
    rememberName(by); afterSave(`Purchased by ${by} ✓`);
  }, ()=>{ buyItem = items.find(x=>x.id===it.id) || it; return `This gift was just updated by someone else — it's now <b>${buyItem.status==="done" ? "Purchased by "+esc(buyerName(buyItem)) : "Open"}</b>. Please review, then save again if needed.`; });
});
function unbuy(it){
  ask({ title:"Undo purchase?", text:`<b>${esc(it.item)}</b> is purchased by <b>${esc(buyerName(it))}</b>. Return it to <b>Open</b> so someone else can buy it?`, field:false, ok:"Undo Purchase" }, async ()=>{
    const r = await api(`/api/items?id=${it.id}`, { method:"PATCH", body:{ status:"open", updatedBy: myName(), base: it.updatedAt } });
    upsert(items, r.item); afterSave("Back to Open ✓");
  });
}
function delGift(it){
  ask({ title:"Delete this gift?", text:`<b>${esc(it.item)}</b> will be removed for everyone.`, field:false, ok:"Delete", danger:true }, async ()=>{
    await api(`/api/items?id=${it.id}`, { method:"DELETE" }); items = items.filter(x=>x.id!==it.id); afterSave("Deleted");
  });
}

/* gift form */
let editing = null, giftId = null, photo = { kind:null, data:null }; // kind: 'upload' | 'url' | 'keep' | null
function setPhoto(kind, data, previewSrc){
  photo = { kind, data };
  const src = previewSrc || (kind==="upload"||kind==="url" ? data : null);
  $("#pv").hidden = !src; if (src) $("#pv").src = src; else $("#pv").removeAttribute("src");
  $("#rmPhoto").hidden = !src;
  $("#dropT").innerHTML = src ? "Tap to replace the photo" : "<b>Tap to add a photo</b> — or paste a copied image";
}
$("#pv").addEventListener("error", ()=>{ if(photo.kind==="url"){ toast("That image can't be shown — try uploading or pasting it instead"); setPhoto(null,null); } });

function openGift(it, personId){
  if (!people.length){ toast("Add a person first, then add their gifts."); return addPerson(); }
  editing = it || null; giftId = it ? it.id : uid(); showErr("#gErr", "");
  $("#gTitle").textContent = it ? "Edit gift" : "Add a gift";
  $("#gPerson").innerHTML = `<option value="" disabled>Choose a person</option>` + people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("#gPerson").value = it?.personId || (personOf(personId) ? personId : "");
  $("#gItem").value = it?.item || ""; $("#gLink").value = it?.link || "";
  $("#gPrice").value = it?.price ? Number(it.price).toLocaleString("id-ID") : ""; $("#gNote").value = it?.note || "";
  $("#gFetchHint").textContent = "Paste a link and we'll try to fill in the photo, name and price.";
  if (it && (it.photoV || it.photoUrl)) setPhoto("keep", null, photoSrc(it)); else setPhoto(null, null);
  $("#gDel").hidden = !it; lastFetched = "";
  openDlg("#ovGift");
}
$("#gPrice").addEventListener("input", e=>{ const d=e.target.value.replace(/\D/g,"").slice(0,12); e.target.value = d ? Number(d).toLocaleString("id-ID") : ""; });
$("#rmPhoto").addEventListener("click", e=>{ e.preventDefault(); setPhoto(null,null); });
$("#gDel").addEventListener("click", ()=>{ const it = editing; closeAll(); if (it) delGift(it); });

/* link → preview (photo, name, price) */
let lastFetched = "";
async function fetchPreview(force){
  const link = safeUrl($("#gLink").value.trim());
  if (!link || (!force && link===lastFetched)) return;
  lastFetched = link;
  const hint = $("#gFetchHint"); hint.innerHTML = `<span class="spin"></span> Looking up the link…`;
  try{
    const d = await api(`/api/preview?url=${encodeURIComponent(link)}`);
    if (!d.ok){ hint.textContent = "Couldn't read that page (some shops block it) — you can add a photo yourself."; return; }
    const got = [];
    if (d.image && (!photo.kind || photo.kind==="url" || force)) { setPhoto("url", d.image); got.push("photo"); }
    if (d.title && !$("#gItem").value.trim()) { $("#gItem").value = d.title.slice(0,200); got.push("name"); }
    if (d.price && !$("#gPrice").value) { $("#gPrice").value = d.price.toLocaleString("id-ID"); got.push("price"); }
    hint.textContent = got.length ? `✓ Filled in ${got.join(", ")} — please check it.` : "Nothing new found on that page.";
  }catch(e){ if(!e.gate) hint.textContent = "Couldn't read that page — fill in the details manually."; }
}
$("#gLink").addEventListener("change", ()=>fetchPreview(false));
$("#gLink").addEventListener("paste", ()=>setTimeout(()=>fetchPreview(false), 0));
$("#gFetch").addEventListener("click", ()=>fetchPreview(true));

/* photo: tap / paste / drop */
const drop = $("#drop");
drop.addEventListener("click", e=>{ if(e.target.tagName!=="INPUT") $("#file").click(); });
drop.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("#file").click(); } });
$("#file").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) handleImage(f); e.target.value=""; });
drop.addEventListener("dragover", e=>{ e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", ()=>drop.classList.remove("over"));
drop.addEventListener("drop", e=>{
  e.preventDefault(); drop.classList.remove("over");
  const f = [...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));
  if (f) return handleImage(f);
  const u = safeUrl((e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain")||"").split("\n")[0].trim());
  if (u) setPhoto("url", u);
});
document.addEventListener("paste", e=>{
  if (!$("#ovGift").classList.contains("on")) return;
  const it = [...(e.clipboardData?.items||[])].find(x=>x.type.startsWith("image/"));
  if (it){ e.preventDefault(); handleImage(it.getAsFile()); }
});
function handleImage(file){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    let max = 800, q = .82, out;
    for (let k=0;k<7;k++){
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
      const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      out = c.toDataURL("image/jpeg", q);
      if (out.length < 300000) break;
      max *= .8; q = Math.max(.5, q-.08);
    }
    URL.revokeObjectURL(url); setPhoto("upload", out);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't read that image"); };
  img.src = url;
}

$("#giftForm").addEventListener("submit", e=>{
  e.preventDefault();
  const personId = $("#gPerson").value;
  if (!personId){ showErr("#gErr", "⚠️ Please choose who the gift is for."); return $("#gPerson").focus(); }
  const body = { personId, item: $("#gItem").value.trim(), link: $("#gLink").value.trim(), price: Number($("#gPrice").value.replace(/\D/g,"")) || 0, note: $("#gNote").value.trim(), updatedBy: myName() };
  if (!body.item){ showErr("#gErr", "⚠️ Please enter the gift name."); return $("#gItem").focus(); }
  if (body.link && !safeUrl(body.link)){ showErr("#gErr", "⚠️ The product link must start with https://"); return $("#gLink").focus(); }
  if (photo.kind === "upload"){ body.photo = photo.data; body.photoUrl = ""; }
  else if (photo.kind === "url"){ body.photo = null; body.photoUrl = photo.data; }
  else if (photo.kind === "keep"){ body.photo = "keep"; }
  else { body.photo = null; body.photoUrl = ""; }
  saving($("#gSave"), "#gErr", async ()=>{
    let r;
    if (editing) r = await api(`/api/items?id=${editing.id}`, { method:"PATCH", body:{ ...body, base: editing.updatedAt } });
    else { if (body.photo === "keep" || body.photo === null) delete body.photo; r = await api("/api/items", { method:"POST", body:{ ...body, id: giftId } }); }
    upsert(items, r.item);
    const wasEditing = !!editing;
    if (route.person !== "all" && route.person !== personId){ closeAll(); setPerson(personId); toast("Saved ✓"); refresh(true); }
    else afterSave(wasEditing ? "Gift updated ✓" : "Gift added ✓");
  }, ()=>{ editing = items.find(x=>x.id===editing?.id) || editing; return CONFLICT; });
});

/* ---------- start ---------- */
render();
refresh(true).then(()=>{ if (loaded) startPolling(); });
</script>
</body>
</html>
